name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build binaries
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/hunter-android-arm64 .
          CGO_ENABLED=0 GOOS=linux  GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/hunter-linux-arm64 .
          CGO_ENABLED=0 GOOS=linux  GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/hunter-linux-amd64 .

      - name: Assemble KernelSU/Magisk module
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p module/bin
          cp dist/hunter-android-arm64 module/bin/hunter
          chmod 755 module/*.sh module/bin/hunter
          (cd module && zip -qr "../dist/oracle-a1-hunter-v${VERSION}-module.zip" . -x 'update.json')
          echo "module zip: dist/oracle-a1-hunter-v${VERSION}-module.zip"

      - name: Checksums
        run: sha256sum dist/* > dist/checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/oracle-a1-hunter-*-module.zip
            dist/hunter-android-arm64
            dist/hunter-linux-arm64
            dist/hunter-linux-amd64
            dist/checksums.txt
